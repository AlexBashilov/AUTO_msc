###################################### Шаблон для запуска тестов
.manual_run_template:
  stage: tests
  dependencies:
    - install
  except:
    - api
    - triggers
    - pipelines
  when: manual
  before_script:
    - wget https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -O ./allurectl
    - chmod +x ./allurectl
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
  script:
    - ./allurectl watch --results _output -- pytest -s -v -n $STREAM_COUNT tests/api/ --alluredir _output
  after_script:
    - ./allurectl job-run env --project-id "${ALLURE_PROJECT_ID}"
    - export $(./allurectl job-run env --project-id "${ALLURE_PROJECT_ID}") >> .env
    - source venv/bin/activate; python reporter.py
    - cat .env
  tags:
    - ci-docker
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - venv/
  artifacts:
    when: always
    paths:
      - _output/
    expire_in: 1 day

###################################### Стадия тестов
integrtest-1:
  extends: .manual_run_template
  variables: !reference [.var-test-1, variables]

integrtest-2:
  extends: .manual_run_template
  variables: !reference [.var-test-2, variables]

integrtest-3:
  extends: .manual_run_template
  variables: !reference [.var-test-3, variables]

integrtest-4:
  extends: .manual_run_template
  variables: !reference [.var-test-4, variables]


#################################### Отправить отчет о прохождении тестов
send_report:
  stage: report
  needs:
    - integrtest-4
  script:
    - source venv/bin/activate; python reporter.py
  tags:
    - ci-docker
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - venv/