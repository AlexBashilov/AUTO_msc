###################################### Запустить автотесты в ручном режиме
tests:
  stage: tests
  dependencies:
    - install
  except:
    - api
    - triggers
    - pipelines
  when: manual
  before_script:
    - wget https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -O ./allurectl
    - chmod +x ./allurectl
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
  script:
    - ./allurectl watch --results _output -- pytest -s -v -n $STREAM_COUNT tests/ --alluredir _output
  after_script:
    - echo -e "\n$(./allurectl job-run env --project-id "${ALLURE_PROJECT_ID}")" >> .env
  tags:
    - ci-docker
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - venv/
  artifacts:
    reports:
      dotenv: .env
    when: always
    paths:
      - _output/
    expire_in: 1 day

#################################### Отправить отчет о прохождении тестов
send_report:
  stage: report
  needs:
    - job: tests
      artifacts: true
  script:
    - source venv/bin/activate
    - helperpackage_send_report
  tags:
    - ci-docker
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - venv/