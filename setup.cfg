[flake8]
#Заглушенные проверки
extend-ignore = E501, ANN001, ANN101, ANN205

#Исключенные файлы для проверки линтером
exclude = .gitlab,.pytest_cache,venv,docs

# Максимальная длина строки
max-line-length = 200

# Контролирует, должны ли функция иметь аннотацию, если она ничего не возвращает
suppress-none-returning = True

[tool.black]
line-length = 200